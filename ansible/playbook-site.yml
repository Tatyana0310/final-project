---
- name: Развертывание сайта
  hosts: web
  become: yes

  tasks:
    - name: Копирование стартовой страницы
      template:
        src: files/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart nginx to apply changes
      service:
        name: nginx
        state: restarted